name: Обновление календаря новостей

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать календарь недели
        run: python3 .github/scripts/update_news.py

      - name: Сохранить в репозиторий
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "news: обновление календаря"
          git push
